<style>@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}</style>
<style>
:root{
  --bg:#0E0F11; --card:#16181C; --card2:#1D2026; --line:#2A2E35; --tx:#F3F4F6; --mut:#9CA3AF; --mut2:#6B7280;
  --a:#3DDC97; --a2:#1F6E4C; --y:#FFC400; --red:#FF6B6B; --pink:#F472B6; --blue:#60A5FA;
  --head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
a{color:var(--a)}
.app{max-width:560px;margin:0 auto;padding:0 14px calc(96px + var(--sab))}
header.top{position:sticky;top:0;z-index:20;background:rgba(14,15,17,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + var(--sat)) 14px 10px;margin:0 -14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:700 18px var(--head);flex:none;color:#0E0F11}
.av.f{background:var(--pink)} .av.m{background:var(--blue)}
.who h1{font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.3px;margin:0;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:.6px}
.brand b{color:var(--a)}
h2{font-family:var(--head);font-weight:700;font-size:28px;letter-spacing:.3px;margin:18px 0 4px;line-height:1.05;text-transform:uppercase}
h3{font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:.4px;margin:0 0 8px;text-transform:uppercase}
.sub{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.muted{color:var(--mut)} .small{font-size:13px}
.card.note{border-color:var(--a);background:linear-gradient(0deg,rgba(61,220,151,.07),rgba(61,220,151,.07)),var(--card);font-size:14px}
details.pickw{margin-top:12px} details.pickw summary{cursor:pointer;color:var(--a);font-weight:600;list-style:none} details.pickw summary::-webkit-details-marker{display:none} details.pickw summary::after{content:" ▾"}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.pill.on{background:var(--a);color:#0b2618;border-color:var(--a);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.a{background:var(--a);color:#0b2618;border-color:var(--a)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn.danger{color:#ff9a9a;border-color:#5b2626}
.btn.yt{background:#2a1212;border-color:#5b2626;color:#fff}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
.dchip{border-radius:12px;padding:8px 0 7px;text-align:center;background:var(--card);border:1px solid var(--line);position:relative}
.dchip b{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.dchip span{display:block;font-family:var(--head);font-size:15px;letter-spacing:-.2px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden}
.dchip.rest span{color:var(--mut2)}
.dchip.sel{border-color:var(--a);background:#0f2219}
.dchip.today::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--a)}
.sess{background:linear-gradient(135deg,#0f2a1e 0%,#16181C 65%);border:1px solid #1f4a36}
.kicker{font-size:12px;color:var(--a);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.sess .name{font-family:var(--head);font-size:32px;font-weight:700;line-height:1;margin:4px 0 2px;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bar{height:8px;border-radius:99px;background:#2a2e35;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--a);border-radius:99px;transition:width .3s}
.list{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.row.complete{border-color:#1e5a3a;background:#111a15}
.fig{width:78px;height:72px;flex:none;border-radius:10px;background:#121418;overflow:hidden}
.fig svg{width:100%;height:100%;display:block}
.rmain{flex:1;min-width:0}
.rnum{font-family:var(--head);color:var(--a);font-size:14px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.rname{font-weight:600;font-size:15px;line-height:1.25}
.rmeta{color:var(--mut);font-size:13px;margin-top:1px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:6px;margin-top:4px;background:#22262d;color:var(--mut)}
.tag.gym{background:#16283d;color:#93c5fd} .tag.db{background:#3a2a07;color:#fcd34d} .tag.bw,.tag.home{background:#2b1d36;color:#d8b4fe} .tag.cardio{background:#3a1520;color:#fda4af}
.rprog{flex:none;min-width:38px;text-align:center;font-family:var(--head);font-size:17px;font-weight:700;color:var(--mut)}
.rprog.full{color:var(--a)}
.opt{font-size:11px;color:var(--y);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateY(102%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet .inner{max-width:560px;margin:0 auto;padding:0 14px calc(110px + var(--sab))}
.sbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 10px;margin:0 -14px 10px;background:rgba(14,15,17,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.sbar .t{flex:1;min-width:0;font-family:var(--head);font-size:20px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.stage{background:radial-gradient(120% 90% at 50% 20%,#1b2a24 0%,#121418 70%);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
.stage svg{width:100%;height:auto;max-height:290px;display:block}
.stage .lbl{position:absolute;left:10px;top:10px}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:10px 0}
.seg button{padding:9px 6px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--a)}
.seg button small{display:block;font-weight:500;font-size:11.5px;color:var(--mut)}
.ex-title{font-family:var(--head);font-size:30px;font-weight:700;text-transform:uppercase;line-height:1;margin:12px 0 6px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 11px 38px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:27px;height:27px;border-radius:9px;background:var(--a);color:#0b2618;font:700 15px/27px var(--head);text-align:center}
.cl{list-style:none;margin:0;padding:0}
.cl li{position:relative;padding:3px 0 3px 26px}
.cl li::before{position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.cl.good li::before{content:"✓";background:#163d29;color:var(--a)}
.cl.bad li::before{content:"✕";background:#3d1616;color:#ff8a8a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.muscles{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;align-items:center}
.muscles svg{width:100%;height:auto}
.mlist div{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:2px 0}
.mlist h4{margin:6px 0 2px;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.m{fill:#2C3138;stroke:#0E0F11;stroke-width:1} .m.p{fill:var(--a)} .m.s{fill:var(--a2)} .n{fill:#3A3F47;stroke:#0E0F11;stroke-width:1}
.abl{stroke:#0E0F11;stroke-width:1;fill:none;opacity:.6} .figlbl{fill:var(--mut);font:600 9px var(--body);letter-spacing:1px}
.setsh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.setsh b{font-family:var(--head);font-size:24px;text-transform:uppercase}
.set{display:grid;grid-template-columns:54px 1fr 54px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .lbl{font-weight:600;color:var(--mut)}
.set input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 12px;font-size:16px}
.set input:focus{outline:2px solid var(--a);border-color:transparent}
.tick{width:54px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--mut2)}
.tick.on{background:var(--a);border-color:var(--a);color:#06210f}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,15,17,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab))}
nav.tabs .wrap{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut2);font-size:11.5px;font-weight:600}
nav.tabs button.on{color:var(--a)}
nav.tabs svg{width:23px;height:23px}
.timer{position:fixed;left:50%;transform:translate(-50%,24px);visibility:hidden;opacity:0;bottom:calc(74px + var(--sab));z-index:60;width:min(532px,calc(100% - 28px));background:#111;border:1px solid var(--a);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .25s,opacity .25s,visibility 0s .25s}
.timer.show{transform:translate(-50%,0);visibility:visible;opacity:1;transition:transform .25s,opacity .25s,visibility 0s}
.timer .tt{flex:1}.timer .tt small{display:block;color:var(--mut);font-size:12px}.timer .tt b{font-family:var(--head);font-size:30px;line-height:1;color:var(--a)}
.timer.go{background:var(--a);color:#0b2618}.timer.go .tt b,.timer.go .tt small{color:#0b2618}
.sheet.open ~ .timer{bottom:calc(14px + var(--sab))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.kv:first-child{border-top:0}
.weekrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.weekrow .wd{width:44px;flex:none;font-family:var(--head);font-size:18px;font-weight:700;text-transform:uppercase}
.weekrow.rest{opacity:.6}.weekrow.today{border-color:var(--a)}
.vbar{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.vbar .tr{height:9px;border-radius:99px;background:#252931;overflow:hidden;position:relative}
.vbar .tr i{position:absolute;inset:0 auto 0 0;background:var(--a);border-radius:99px}
.vbar .tr u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.5}
.info{border-left:3px solid var(--a);padding:10px 12px;background:var(--card);border-radius:0 12px 12px 0;margin:10px 0}
.info b{display:block;margin-bottom:2px}
.info .src{display:block;font-size:12px;margin-top:4px}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgt{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px}
.tgt b{display:block;font-family:var(--head);font-size:24px;line-height:1.05}
.tgt span{color:var(--mut);font-size:12px}
.srcs li{margin-bottom:8px;font-size:13px}
/* wizard */
.wiz{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:none}
.wiz.open{display:block}
.wiz .inner{max-width:520px;margin:0 auto;padding:calc(18px + var(--sat)) 18px calc(30px + var(--sab));min-height:100%;display:flex;flex-direction:column}
.dots{display:flex;gap:6px;margin:8px 0 18px}.dots i{flex:1;height:4px;border-radius:9px;background:#2a2e35}.dots i.on{background:var(--a)}
.wiz h2{font-size:34px;margin-top:6px}
.choice{display:grid;gap:10px}
.cbtn{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px}
.cbtn.on{border-color:var(--a);background:#0f2219}
.cbtn .ic{font-size:26px;width:40px;text-align:center;flex:none}
.cbtn b{display:block;font-size:16px}.cbtn span{color:var(--mut);font-size:13px}
.sexpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sexpick .cbtn{flex-direction:column;text-align:center;gap:6px;padding:12px}
.sexpick svg{width:100%;height:auto;max-height:170px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-size:20px}
.field input:focus{outline:2px solid var(--a);border-color:transparent}
.err{color:#ff9a9a;font-size:13px;min-height:18px}
.grow{flex:1}
.wnav{display:flex;gap:10px;margin-top:18px}
.wnav .btn{flex:1;padding:14px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minis button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700}
.minis button.on{background:var(--a);color:#0b2618;border-color:var(--a)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px}
.days button.on{background:var(--a);color:#0b2618;border-color:var(--a)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .panel{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:16px 16px calc(24px + var(--sab))}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
.prow.on{border-color:var(--a)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="who" data-act="profiles" aria-label="Switch profile"><div class="av" id="av">?</div><div style="min-width:0"><h1 id="hname">FitForm</h1><small id="hsub"></small></div></button>
    <div class="brand">FIT<b>FORM</b></div>
  </header>
  <main id="view"></main>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="inner" id="sheetIn"></div></div>
<div class="timer" id="timer" aria-live="polite"><div class="tt"><small id="tLbl">Rest</small><b id="tVal">0:00</b></div><button class="btn sm" data-act="t15">+15 s</button><button class="btn sm" data-act="tskip">Skip</button></div>
<nav class="tabs" id="tabs"><div class="wrap">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6M6.5 4v16M17.5 4v16"/></svg>Today</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Plan</button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Exercises</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
</div></nav>
<div class="modal" id="modal"><div class="panel" id="modalIn"></div></div>
<div class="wiz" id="wiz"><div class="inner" id="wizIn"></div></div>

<script>
/* ================= Animated figure rig (side + front views) ================= */
const RIG = (() => {
  const L = { tor: 50, neck: 7, head: 9, ua: 28, fa: 26, th: 41, sh: 40, ft: 13 };
  const D = Math.PI / 180;
  const dn = a => [Math.sin(a * D), Math.cos(a * D)];          // angle from straight down; + = forward (+x)
  const add = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];
  const has = (o, k) => o[k] !== undefined;
  const C = { near: "#E8EAED", far: "#7C8492", frame: "#4B5563", pad: "#30353D", padS: "#5B6472", w: "#FFC400", wd: "#7A5E00", cable: "#A3AAB5", floor: "#2E333B", band: "#F06292", hair: "#C9A27A" };

  function ik(B, T, a, b, s) {
    const dx = T[0] - B[0], dy = T[1] - B[1];
    const d = Math.hypot(dx, dy) || 0.001;
    const dc = Math.max(Math.abs(a - b) + 0.5, Math.min(a + b - 0.3, d));
    const th = Math.atan2(dy, dx);
    const A = Math.acos(Math.max(-1, Math.min(1, (a * a + dc * dc - b * b) / (2 * a * dc))));
    const j1 = [B[0] + a * Math.cos(th + A), B[1] + a * Math.sin(th + A)];
    const j2 = [B[0] + a * Math.cos(th - A), B[1] + a * Math.sin(th - A)];
    const cr = j => dx * (j[1] - B[1]) - dy * (j[0] - B[0]);
    const J = (cr(j1) * s >= 0) ? j1 : j2;
    const ux = T[0] - J[0], uy = T[1] - J[1], ul = Math.hypot(ux, uy) || 1;
    return [J, [J[0] + ux / ul * b, J[1] + uy / ul * b]];
  }

  /* ---------- side view ---------- */
  function solveSide(p) {
    const hip = p.hip, tr = p.tr || 0;
    const tv = [Math.sin(tr * D), -Math.cos(tr * D)];
    const sh = add(hip, tv, L.tor);
    const hd = (p.hd || 0) + tr;
    const hv = [Math.sin(hd * D), -Math.cos(hd * D)];
    const head = add(sh, hv, L.neck + L.head);
    const arm = k => {
      let src = p;
      if (k === "F" && !has(p, "aF") && !has(p, "atF") && !has(p, "hF") && !has(p, "hrF")) {
        src = { aF: p.aN, atF: p.atN, hF: p.hN && [p.hN[0] - 3, p.hN[1] - 1], hrF: p.hrN && [p.hrN[0] - 3, p.hrN[1] - 1], eF: p.eN };
      }
      let a = src["a" + k];
      const at = src["at" + k], h = src["h" + k], hr = src["hr" + k];
      if (at) a = [at[0] - tr, at[1] - tr];
      if (a) { const e = add(sh, dn(a[0]), L.ua); return [e, add(e, dn(a[1]), L.fa)]; }
      const T = h ? h : add(sh, hr || [0, 52]);
      const s = has(src, "e" + k) && src["e" + k] !== undefined ? src["e" + k] : 1;
      return ik(sh, T, L.ua, L.fa, s);
    };
    const leg = k => {
      let src = p;
      if (k === "F" && !has(p, "lF") && !has(p, "fF") && !has(p, "frF")) {
        src = { lF: p.lN, fF: p.fN && [p.fN[0] - 4, p.fN[1]], frF: p.frN && [p.frN[0] - 4, p.frN[1]], kF: p.kN };
      }
      const l = src["l" + k], f = src["f" + k], fr = src["fr" + k];
      if (l) { const kn = add(hip, dn(l[0]), L.th); return [kn, add(kn, dn(l[1]), L.sh)]; }
      const T = f ? f : add(hip, fr || [0, 80]);
      const s = has(src, "k" + k) && src["k" + k] !== undefined ? src["k" + k] : -1;
      return ik(hip, T, L.th, L.sh, s);
    };
    const [eN, wN] = arm("N"), [eF, wF] = arm("F");
    const [kN, aN] = leg("N"), [kF, aF] = leg("F");
    const toe = (an, t) => add(an, [Math.cos(t * D), Math.sin(t * D)], L.ft);
    const tN = toe(aN, p.tN ?? 0), tF = toe(aF, p.tF ?? (p.tN ?? 0));
    return { view: "side", hip, sh, head, hv, hd, eN, wN, eF, wF, kN, aN, kF, aF, tN, tF };
  }

  /* ---------- front view ---------- */
  function solveFront(p, fem) {
    const cx = p.cx ?? 120, hy = p.hipY ?? 122, tl = p.tl ?? 1;
    const sw = fem ? 15 : 18, hw = fem ? 11 : 9;
    const shY = hy - L.tor * tl;
    const S = [[cx - sw, shY], [cx + sw, shY]], Hh = [[cx - hw, hy], [cx + hw, hy]];
    const head = [cx, shY - 16 + (p.hdy || 0)];
    const arms = [-1, 1].map((sd, i) => {
      const ar = (sd < 0 ? p.aL : p.aR) || p.a || [6, 6];
      const ual = (sd < 0 ? p.ualL : p.ualR) ?? p.ual ?? 1;
      const e = [S[i][0] + sd * Math.sin(ar[0] * D) * L.ua * ual, S[i][1] + Math.cos(ar[0] * D) * L.ua];
      const w = [e[0] + sd * Math.sin(ar[1] * D) * L.fa, e[1] + Math.cos(ar[1] * D) * L.fa];
      return [e, w];
    });
    const legs = [-1, 1].map((sd, i) => {
      const lg = (sd < 0 ? p.lL : p.lR) || p.l || [3, 0], tlf = p.tlf ?? 1;
      const k = [Hh[i][0] + sd * Math.sin(lg[0] * D) * L.th, Hh[i][1] + Math.cos(lg[0] * D) * L.th * tlf];
      const a = [k[0] + sd * Math.sin(lg[1] * D) * L.sh, k[1] + Math.cos(lg[1] * D) * L.sh];
      return [k, a];
    });
    return { view: "front", S, Hh, head, cx, shY, hy, eL: arms[0][0], wL: arms[0][1], eR: arms[1][0], wR: arms[1][1], kL: legs[0][0], aL: legs[0][1], kR: legs[1][0], aR: legs[1][1] };
  }

  /* ---------- interpolation & timeline ---------- */
  function lerp(a, b, u) {
    if (typeof a === "number" && typeof b === "number") return a + (b - a) * u;
    if (Array.isArray(a) && Array.isArray(b)) return a.map((v, i) => lerp(v, b[i], u));
    return u < .5 ? a : b;
  }
  function lerpPose(A, B, u) { const o = {}; for (const k in A) o[k] = has(B, k) ? lerp(A[k], B[k], u) : A[k]; for (const k in B) if (!has(o, k)) o[k] = B[k]; return o; }
  function poseAt(an, t) {
    const fr = an.frames; if (fr.length === 1) return fr[0];
    const dur = an.dur || 1050, hold = an.hold ?? (an.loop ? 0 : 280);
    let seq;
    if (an.loop) seq = fr.map((_, i) => i).concat([0]);
    else { seq = fr.map((_, i) => i); for (let i = fr.length - 2; i >= 0; i--) seq.push(i); }
    const seg = dur + hold, n = seq.length - 1, tt = ((t % (seg * n)) + seg * n) % (seg * n);
    const i = Math.min(n - 1, Math.floor(tt / seg));
    let u = Math.min(1, (tt - i * seg) / dur);
    if (!an.loop) u = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    return lerpPose(fr[seq[i]], fr[seq[i + 1]], u);
  }

  /* ---------- drawing ---------- */
  const f1 = n => Math.round(n * 10) / 10;
  const ln = (a, b, w, c, extra) => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${extra || ""}/>`;
  const circ = (p, r, c, s) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="${c}"${s ? ` stroke="${s}" stroke-width="1.5"` : ""}/>`;

  function jointOf(G, name) {
    if (Array.isArray(name)) return name;
    return G[name] || [0, 0];
  }
  function drawProp(pr, G) {
    const c = pr.c;
    switch (pr.t) {
      case "bench": {
        const { x, y, w } = pr, h = pr.h || 7;
        return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${C.pad}" stroke="${C.padS}"/>` +
          ln([x + 8, y + h], [x + 8, 206], 4, C.frame) + ln([x + w - 8, y + h], [x + w - 8, 206], 4, C.frame);
      }
      case "pad": {
        const tf = pr.rot ? ` transform="rotate(${pr.rot} ${pr.cx ?? pr.x + pr.w / 2} ${pr.cy ?? pr.y + pr.h / 2})"` : "";
        return `<rect x="${pr.x}" y="${pr.y}" width="${pr.w}" height="${pr.h}" rx="${pr.r ?? 3}" fill="${c || C.pad}" stroke="${C.padS}"${tf}/>`;
      }
      case "line": return ln([pr.p[0], pr.p[1]], [pr.p[2], pr.p[3]], pr.w || 4, c || C.frame);
      case "circle": return circ([pr.x, pr.y], pr.r, c || C.frame, pr.s);
      case "tower": {
        const x = pr.x, top = pr.top ?? 22;
        return `<rect x="${x - 7}" y="${top}" width="14" height="${206 - top}" rx="3" fill="#20242A" stroke="${C.frame}"/>` +
          `<rect x="${x - 5}" y="${206 - 48}" width="10" height="44" rx="2" fill="#2B3038" stroke="${C.padS}"/>`;
      }
      case "rail": return ln([pr.x, pr.top ?? 26], [pr.x, 206], 4, C.frame) + ln([pr.x - 8, pr.top ?? 26], [pr.x + 8, pr.top ?? 26], 4, C.frame);
      case "plate": {
        const p = add(jointOf(G, pr.at), pr.off || [0, 0]), r = pr.r || 14;
        return circ(p, r, C.w) + circ(p, r * 0.32, C.wd) + circ(p, 2.2, "#111");
      }
      case "db": {
        const out = [];
        const one = (j, far) => {
          const p = add(jointOf(G, j), pr.off || [0, 0]);
          if (pr.v) return `<rect x="${f1(p[0] - 5)}" y="${f1(p[1] - 11)}" width="10" height="22" rx="3" fill="${far ? C.wd : C.w}" stroke="#111" stroke-width="1"/>`;
          return circ(p, pr.r || 7, far ? C.wd : C.w, "#111") + circ(p, 2, "#111");
        };
        if (pr.both) out.push(one(pr.at.replace("N", "F"), true));
        out.push(one(pr.at, false));
        return out.join("");
      }
      case "cable": {
        const to = add(jointOf(G, pr.to), pr.off || [0, 0]);
        return ln(pr.from, to, 1.6, C.cable) + circ(pr.from, 4, "#20242A", C.cable);
      }
      case "lever": { const to = jointOf(G, pr.to); return ln(pr.from, to, 6, C.frame) + circ(pr.from, 4, C.frame); }
      case "grip": return circ(add(jointOf(G, pr.at), pr.off || [0, 0]), pr.r || 4, c || "#9CA3AF");
      case "roller": return circ(add(jointOf(G, pr.at), pr.off || [0, 0]), pr.r || 6, C.pad, C.padS);
      case "att": {
        const ctr = add(jointOf(G, pr.at), pr.off || [0, 0]), a = (pr.ang || 0) * D, h = (pr.len || 30) / 2;
        const v = [Math.cos(a) * h, Math.sin(a) * h];
        return ln([ctr[0] - v[0], ctr[1] - v[1]], [ctr[0] + v[0], ctr[1] + v[1]], pr.w || 5, c || C.frame);
      }
      case "band": {
        const a = jointOf(G, pr.a), b = jointOf(G, pr.b);
        return `<ellipse cx="${f1((a[0] + b[0]) / 2)}" cy="${f1((a[1] + b[1]) / 2)}" rx="${f1(Math.abs(b[0] - a[0]) / 2 + 6)}" ry="4" fill="none" stroke="${C.band}" stroke-width="3"/>`;
      }
      case "bottle": { const p = add(jointOf(G, pr.at), pr.off || [0, 0]); return `<rect x="${f1(p[0] - 4)}" y="${f1(p[1] - 9)}" width="8" height="18" rx="3" fill="#60A5FA" stroke="#111" stroke-width="1"/><rect x="${f1(p[0] - 2)}" y="${f1(p[1] - 12)}" width="4" height="4" rx="1" fill="#93C5FD"/>`; }
      case "bag": { const p = add(jointOf(G, pr.at), pr.off || [0, 0]); return `<path d="M${f1(p[0] - 5)} ${f1(p[1] - 2)} Q ${f1(p[0])} ${f1(p[1] - 12)} ${f1(p[0] + 5)} ${f1(p[1] - 2)}" stroke="#9CA3AF" stroke-width="2.5" fill="none"/><rect x="${f1(p[0] - 9)}" y="${f1(p[1] - 1)}" width="18" height="20" rx="5" fill="#3B5BA9" stroke="#111" stroke-width="1"/>`; }
      case "box": return `<rect x="${pr.x}" y="${pr.y}" width="${pr.w}" height="${206 - pr.y}" rx="3" fill="${C.pad}" stroke="${C.padS}"/>`;
      case "tread": return `<rect x="${pr.x}" y="198" width="${pr.w}" height="8" rx="3" fill="#23272E" stroke="${C.frame}"/>` + ln([pr.x + pr.w, 200], [pr.x + pr.w + 10, 110], 5, C.frame) + ln([pr.x + pr.w + 10, 110], [pr.x + pr.w - 18, 112], 5, C.frame) + `<rect x="${pr.x + pr.w}" y="98" width="20" height="12" rx="3" fill="#2B3038" stroke="${C.frame}"/>`;
    }
    return "";
  }

  function drawSide(G, an, fem) {
    const props = an.props || [];
    const layer = z => props.filter(p => (p.z || (["bench", "pad", "tower", "rail", "line", "box", "tread", "circle"].includes(p.t) ? "b" : "f")) === z).map(p => drawProp(p, G)).join("");
    const o = [];
    if (!an.noFloor) o.push(ln([4, 206], [236, 206], 2, C.floor));
    o.push(layer("b"));
    // far limbs
    o.push(ln(G.hip, G.kF, 11, C.far), ln(G.kF, G.aF, 9, C.far), ln(G.aF, G.tF, 5, C.far));
    o.push(ln(G.sh, G.eF, 8, C.far), ln(G.eF, G.wF, 7, C.far));
    o.push(layer("m"));
    // torso & head
    o.push(ln(G.hip, G.sh, 15, C.near));
    if (fem) {
      const hv = G.hv, fw = [hv[1] * -1, hv[0]];                 // forward = rotate(hv, +90)
      const back = [-fw[0], -fw[1]];
      const anc = add(add(G.head, back, 7), hv, 3);
      const end = add(add(anc, back, 5), [0, 1], 13);
      o.push(`<path d="M${f1(anc[0])} ${f1(anc[1])} Q ${f1(anc[0] + back[0] * 9)} ${f1(anc[1] + back[1] * 9 + 2)} ${f1(end[0])} ${f1(end[1])}" stroke="${C.hair}" stroke-width="5" fill="none" stroke-linecap="round"/>`);
    }
    o.push(circ(G.head, 9.5, C.near));
    // near limbs
    o.push(ln(G.hip, G.kN, 12, C.near), ln(G.kN, G.aN, 10, C.near), ln(G.aN, G.tN, 6, C.near));
    o.push(ln(G.sh, G.eN, 9, C.near), ln(G.eN, G.wN, 8, C.near));
    o.push(layer("f"));
    return o.join("");
  }

  function drawFront(G, an, fem) {
    const props = an.props || [];
    const layer = z => props.filter(p => (p.z || (["bench", "pad", "tower", "rail", "line", "box", "circle"].includes(p.t) ? "b" : "f")) === z).map(p => drawProp(p, G)).join("");
    const o = [];
    if (!an.noFloor) o.push(ln([4, 206], [236, 206], 2, C.floor));
    o.push(layer("b"));
    const c = C.near;
    // legs
    o.push(ln(G.Hh[0], G.kL, 12, c), ln(G.kL, G.aL, 10, c), ln(G.Hh[1], G.kR, 12, c), ln(G.kR, G.aR, 10, c));
    o.push(ln(G.aL, add(G.aL, [-7, 3]), 6, c), ln(G.aR, add(G.aR, [7, 3]), 6, c));
    // torso
    const mS = [G.cx, G.shY], mH = [G.cx, G.hy];
    o.push(`<polygon points="${f1(G.S[0][0] - 3)},${f1(G.S[0][1] - 2)} ${f1(G.S[1][0] + 3)},${f1(G.S[1][1] - 2)} ${f1(G.Hh[1][0] + 5)},${f1(G.Hh[1][1] + 4)} ${f1(G.Hh[0][0] - 5)},${f1(G.Hh[0][1] + 4)}" fill="${c}" stroke="${c}" stroke-width="8" stroke-linejoin="round"/>`);
    o.push(layer("m"));
    if (fem) o.push(`<path d="M${f1(G.head[0] - 11)} ${f1(G.head[1] + 6)} Q ${f1(G.head[0] - 12)} ${f1(G.head[1] - 13)} ${f1(G.head[0])} ${f1(G.head[1] - 12)} Q ${f1(G.head[0] + 12)} ${f1(G.head[1] - 13)} ${f1(G.head[0] + 11)} ${f1(G.head[1] + 6)}" stroke="${C.hair}" stroke-width="5" fill="none" stroke-linecap="round"/>`);
    o.push(circ(G.head, 9.5, c));
    // arms
    o.push(ln(G.S[0], G.eL, 9, c), ln(G.eL, G.wL, 8, c), ln(G.S[1], G.eR, 9, c), ln(G.eR, G.wR, 8, c));
    o.push(layer("f"));
    return o.join("");
  }

  function svgAt(an, t, fem) {
    const P = poseAt(an, t);
    const G = an.v === "front" ? solveFront(P, fem) : solveSide(P);
    return an.v === "front" ? drawFront(G, an, fem) : drawSide(G, an, fem);
  }
  function midT(an) { const dur = an.dur || 1050; return (an.loop ? dur * 0.5 : dur * 0.5); }
  return { svgAt, poseAt, midT };
})();
