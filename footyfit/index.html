<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Fitness</title>
<meta name="description" content="FIFA 11+ Kids warm-up, core, strength, speed and agility training for young footballers, with profiles, schedules and progress tracking.">
<meta name="theme-color" content="#16774a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FootyFit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
:root{
  /* Layout: app shell — profile bar on top, one column of cards, bottom tab bar; exercise cards lead with an animated stick-figure demo on a pitch strip */
  --paper:#f2f5ef; --card:#ffffff; --ink:#16231c; --muted:#56655c; --line:#d8e0d5;
  --pitch:#16774a; --pitch-soft:#e0f0e5; --cone:#d9570f; --cone-soft:#fce6d8; --danger:#b8322a;
  --sky:#ecf3ee; --grass:#cde4d4; --grass2:#c3ddca; --far:#9aa9a1; --alt:#d9570f; --alt-far:#efa47a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1411; --card:#151e19; --ink:#e3ece6; --muted:#9bafa3; --line:#27342d;
    --pitch:#4cc188; --pitch-soft:#163025; --cone:#ff8a4a; --cone-soft:#3a2416; --danger:#ff7a6e;
    --sky:#132019; --grass:#1c3226; --grass2:#203829; --far:#61756a; --alt:#ff8a4a; --alt-far:#94593a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1411; --card:#151e19; --ink:#e3ece6; --muted:#9bafa3; --line:#27342d;
  --pitch:#4cc188; --pitch-soft:#163025; --cone:#ff8a4a; --cone-soft:#3a2416; --danger:#ff7a6e;
  --sky:#132019; --grass:#1c3226; --grass2:#203829; --far:#61756a; --alt:#ff8a4a; --alt-far:#94593a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.locked{overflow:hidden}
a{color:var(--pitch)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--cone);outline-offset:2px}
/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.appbar-in{max-width:760px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px}
.prof{flex:1;display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:4px;text-align:left;cursor:pointer;min-width:0}
.pt{display:grid;min-width:0}
.pn{font:800 21px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caret{color:var(--muted);font-size:13px}
.av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:800 19px/1 var(--display)}
.av.big{width:44px;height:44px;font-size:22px}
.more{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:22px;line-height:1}
.more[aria-current="page"]{background:var(--ink);color:var(--paper)}
.note{margin:0;font-size:14px;background:var(--cone-soft);padding:8px 12px;border-radius:10px}
.banner{max-width:760px;margin:8px auto 0;padding:0 12px}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bnav a{display:grid;justify-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font:600 12px/1 var(--body)}
.bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav a[aria-current="page"]{color:var(--pitch)}
.bnav a[aria-current="page"] svg{stroke-width:2.6}
/* layout */
main{max-width:760px;margin:0 auto;padding:12px 14px 20px}
.view{display:grid;gap:12px}
.eyebrow{margin:2px 2px 0;font-size:14px;color:var(--muted);font-weight:600}
.lead,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.lead h2{font-size:28px;text-transform:uppercase}
.lead p,.box p{margin:0}
.box h3{font-size:20px;text-transform:uppercase}
.box.alert{border-left:4px solid var(--cone)}
.meta,.row{display:flex;gap:8px;align-items:center}
.row.wrap,.meta{flex-wrap:wrap}
.pill{font:600 13px/1 var(--body);padding:6px 9px;border-radius:999px;background:var(--pitch-soft);color:var(--ink)}
.pill.o{background:var(--cone-soft)}
.small{font-size:14px;color:var(--muted)}
.link{font-weight:600;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:#fff}
.btn.big{min-height:52px;font-size:17px;flex:1}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
:root[data-theme="dark"] .btn.primary{color:#06130c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#06130c}}
.chip-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;min-height:38px}
.welcome{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 18px;display:grid;gap:12px;justify-items:start}
.welcome img{border-radius:18px}
.welcome h2{font-size:34px;text-transform:uppercase}
.welcome p{margin:0;max-width:60ch}
/* today */
.today-card{border-radius:16px;padding:16px;display:grid;gap:8px;background:var(--card);border:1px solid var(--line);position:relative}
.today-card .badge{justify-self:start;font:800 18px/1 var(--display);padding:6px 10px;border-radius:8px;background:var(--ink);color:var(--paper);text-transform:uppercase}
.today-card h2{font-size:30px;text-transform:uppercase}
.today-card p{margin:0}
.t-A .badge,.t-lite .badge{background:var(--pitch);color:#fff}
.t-B .badge{background:var(--cone);color:#fff}
.today-card.t-A,.today-card.t-lite{border-top:5px solid var(--pitch)}
.today-card.t-B{border-top:5px solid var(--cone)}
.today-card.t-C{border-top:5px solid var(--ink)}
.mins{color:var(--muted);font-size:14px}
.names{list-style:none;margin:2px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.names li{font-size:13px;font-weight:600;background:var(--sky);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.donep{font-weight:700;color:var(--pitch)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:grid;justify-items:center;gap:2px;padding:7px 2px;border-radius:10px;background:var(--sky);border:1px solid transparent;min-width:0}
.wd .d{font:700 13px/1 var(--display);text-transform:uppercase;color:var(--muted)}
.wd .s{font:800 15px/1.1 var(--display);text-transform:uppercase;white-space:nowrap}
.wd .m{font-size:13px;height:16px;font-weight:700}
.wd.t-A .s,.wd.t-lite .s{color:var(--pitch)}
.wd.t-B .s{color:var(--cone)}
.wd.t-club .s,.wd.t-rest .s,.wd.t-match .s{color:var(--muted);font-size:12px}
.wd.done{background:var(--pitch-soft)}.wd.done .m{color:var(--pitch)}
.wd.missed .m{color:var(--muted)}
.wd.now{border-color:var(--ink)}
.bar{height:10px;border-radius:999px;background:var(--sky);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--pitch)}
.tip{font-size:15px;padding:12px 14px;border-radius:12px;background:var(--pitch-soft)}
.tip b{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;margin-right:6px}
/* week */
.days{display:grid;gap:6px}
.drow{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow label{font:700 16px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.drow.t-A label,.drow.t-lite label{color:var(--pitch)}.drow.t-B label{color:var(--cone)}
select,input[type=date],input[type=number],input[type=text],input:not([type]),textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
.warn{margin:6px 0 0;padding:10px 12px 10px 28px;border-radius:10px;background:var(--cone-soft);display:grid;gap:4px;font-size:14px}
.ok{color:var(--pitch);font-weight:600;font-size:15px;margin:4px 0 0}
.okbox{border-color:var(--pitch);background:var(--pitch-soft);font-size:15px}
.warnline{color:var(--cone);font-weight:600}
.subh{font:800 18px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:4px 2px 0}
.drow.now{background:var(--sky);border-radius:8px}
.wkdays .drow{grid-template-columns:92px 1fr auto}
.wkt{font-size:15px;font-weight:600}.wkt small{color:var(--muted);font-weight:500}
.lvl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lvn{font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.lvn b{font-size:20px;color:var(--pitch)}
.chip-btn:disabled{opacity:.4;cursor:default}
.vsw{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:100%}
.vsw button{flex:1 1 0;border:0;background:var(--card);padding:9px 8px;font:600 13.5px/1.2 var(--body);cursor:pointer;min-height:40px;color:var(--ink)}
.vsw button+button{border-left:1px solid var(--line)}
.vsw button[aria-pressed="true"]{background:var(--pitch);color:#fff}
:root[data-theme="dark"] .vsw button[aria-pressed="true"]{color:#06130c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vsw button[aria-pressed="true"]{color:#06130c}}
.vid.sm{padding:6px 8px;min-height:30px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form small{font-weight:400;color:var(--muted)}
.colors{border:0;padding:0;margin:0;display:flex;gap:10px;flex-wrap:wrap}
.colors legend{font-weight:600;font-size:14px;margin-bottom:6px}
.sw{position:relative}
.sw input{position:absolute;opacity:0;inset:0}
.sw span:not(.vh){display:block;width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible+span{outline:3px solid var(--cone);outline-offset:2px}
/* workouts */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 13px;font:700 15px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.block-h{display:grid;gap:3px;margin-top:4px}
.block-h h3{font-size:21px;text-transform:uppercase;color:var(--pitch)}
.block-h p{margin:0;color:var(--muted);font-size:15px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
@media (min-width:660px){.ex{grid-template-columns:250px 1fr}.ex>.fig{border-right:1px solid var(--line);border-bottom:0}}
.fig{border-bottom:1px solid var(--line);background:linear-gradient(var(--sky) 90.6%,var(--grass) 90.6%);display:flex;align-items:flex-end;justify-content:center}
.fig svg{display:block;width:100%;height:auto;max-height:190px}
.ex-b{padding:12px 14px 14px;display:grid;gap:8px;align-content:start}
.ex-top{display:flex;gap:10px;align-items:baseline}
.code{font:800 15px/1 var(--display);color:var(--pitch);background:var(--pitch-soft);border-radius:6px;padding:4px 7px;flex:0 0 auto}
.ex-top h4{font:700 23px/1.05 var(--display);text-transform:uppercase}
.tag{font-size:14px;color:var(--muted);margin:-4px 0 0}
.now{font-size:15px;margin:0;padding-left:10px;border-left:3px solid var(--cone)}
.doses{display:flex;gap:8px;flex-wrap:wrap}
.dose{display:grid;gap:2px;border-radius:10px;padding:7px 11px;border:0;text-align:left;background:var(--pitch-soft);font-variant-numeric:tabular-nums}
.dose.y12{background:var(--cone-soft)}
.dose.both{background:var(--sky);border:1px solid var(--line)}
.dose small{font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dose span{font-weight:700;font-size:16px;line-height:1.2}
.dose .go{font-style:normal;font-size:12px;color:var(--pitch)}
button.dose{cursor:pointer}
.cues{margin:0;padding-left:18px;display:grid;gap:3px;font-size:15px}
.watch{margin:0;font-size:14px;color:var(--muted)}
.watch b{color:var(--ink)}
.extra{margin:0;font-size:14px;background:var(--cone-soft);border-radius:8px;padding:7px 10px}
.ex-act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vid{display:inline-flex;gap:7px;align-items:center;text-decoration:none;font:700 14px/1 var(--body);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:var(--paper);min-height:38px}
.yt{width:16px;height:16px}
/* library */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.lib{grid-template-columns:repeat(3,1fr)}}
.lcard{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);padding:0;text-align:left;cursor:pointer}
.lcard .fig{border-bottom:1px solid var(--line)}
.lt{display:grid;gap:1px;padding:8px 10px 10px}
.lt b{font:700 17px/1.1 var(--display);text-transform:uppercase}
.lt small{color:var(--muted);font-size:12px}
/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.tile b{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 5px;text-align:left;vertical-align:middle}
th{font-weight:700}
thead th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr.cur{background:var(--pitch-soft)}
table.tests input{width:100%;min-width:48px;max-width:72px;min-height:38px;padding:6px 4px;font-size:16px;text-align:center}
table.tests th:first-child{width:92px}
table.tests td{padding:5px 3px}
table.tests th small{color:var(--muted);font-weight:400}
.chg{font-weight:700;white-space:nowrap}
.chg.up{color:var(--pitch)}.chg.down{color:var(--cone)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0;padding-left:18px;display:grid;gap:5px;font-size:14px}
details p{margin:6px 0 4px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hb{font:800 14px/1 var(--display);padding:6px 7px;border-radius:7px;background:var(--ink);color:var(--paper);min-width:44px;text-align:center}
.hb.t-A,.hb.t-lite{background:var(--pitch);color:#fff}.hb.t-B{background:var(--cone);color:#fff}
.hm{font-size:14px}
.painf{color:var(--cone);font-weight:700}
.del{border:0;background:transparent;font-size:22px;color:var(--muted);width:40px;height:40px;cursor:pointer}
/* more */
.profs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.profs li{display:flex;align-items:center;gap:10px}
.pi{flex:1;display:grid;min-width:0}
.pi b{font:800 19px/1.1 var(--display);text-transform:uppercase}
.pi small{color:var(--muted);font-size:13px}
.pbtn{width:100%;display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);text-align:left;cursor:pointer}
.pbtn.on{border:2px solid var(--pitch);background:var(--pitch-soft)}
.box ol{margin:0;padding-left:20px;display:grid;gap:6px}
.src{font-size:14px}
.code-area{min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace}
/* sheet */
.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(10,20,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:10px;align-content:start}
.sheet h2{font-size:26px;text-transform:uppercase;padding-right:40px}
.sheet p{margin:0}
.sheet-x{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:22px;cursor:pointer;z-index:2}
.sheet-fig{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sheet .tbl-wrap td,.sheet .tbl-wrap th{font-size:13px}
/* session */
.session{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto;display:flex;flex-direction:column}
.ss-top{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ss-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer;flex:0 0 auto}
.ss-prog{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.ss-prog i{display:block;height:100%;background:var(--pitch);transition:width .3s}
.ss-n{font:700 15px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.ss-body{flex:1;width:100%;max-width:640px;margin:0 auto;padding:12px 16px 18px;display:grid;gap:10px;align-content:start}
.ss-body.center{text-align:center;justify-items:center;align-content:center}
.ss-label{margin:0;font:700 14px/1.2 var(--body);color:var(--pitch);text-transform:uppercase;letter-spacing:.05em}
.ss-fig{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(var(--sky) 90.6%,var(--grass) 90.6%);width:100%}
.ss-fig svg{display:block;width:100%;height:auto;max-height:36vh}
.ss-fig.small{max-width:220px}
.ss-body h2{font-size:34px;text-transform:uppercase}
.ss-dose{margin:0;font:800 30px/1.05 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.btn.timer{background:var(--ink);color:var(--paper);border-color:var(--ink);font:800 24px/1 var(--display);min-height:56px;font-variant-numeric:tabular-nums}
.big-t{font:800 88px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--cone)}
.ss-foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.ss-foot>*{max-width:320px}
.feel{display:flex;gap:8px}
.feel button{min-width:86px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.feel button[aria-checked="true"]{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.q{font-weight:700;margin:6px 0 0}
.chk{display:flex;gap:8px;align-items:center;font-weight:600}
.chk input{width:22px;height:22px}
.ss-body .form{width:100%;max-width:360px;text-align:left}
/* timer pill + toast */
.tpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.tpill b{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums;min-width:58px}
.tpill button{border:0;border-radius:999px;background:var(--cone);color:#fff;font-weight:700;padding:8px 14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast,.ss-prog i{transition:none}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <button type="button" class="prof" id="profBtn" data-act="prof-switch"></button>
    <a class="more" href="#more" aria-label="Profiles, backup, install and advice" data-v="more">⋯</a>
  </div>
</header>
<div class="banner" id="previewNote" hidden><p class="note">Preview inside Claude: profiles are kept in this browser only. Install the app from <a href="https://mial8727.github.io/footyfit/" target="_blank" rel="noopener">mial8727.github.io/footyfit</a> to keep them safely on the phone.</p></div>
<div class="banner" id="storeWarn" hidden><p class="note">This browser isn't letting the app save. Profiles will be lost when you close it.</p></div>

<main>
  <section class="view" id="v-today" aria-label="Today"></section>
  <section class="view" id="v-week" aria-label="Training week" hidden></section>
  <section class="view" id="v-workouts" aria-label="Workouts" hidden></section>
  <section class="view" id="v-library" aria-label="Exercise library" hidden></section>
  <section class="view" id="v-progress" aria-label="Progress" hidden></section>
  <section class="view" id="v-more" aria-label="More" hidden></section>
</main>

<nav class="bnav" aria-label="Main">
  <div class="bnav-in">
    <a href="#today" data-v="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</a>
    <a href="#week" data-v="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</a>
    <a href="#workouts" data-v="workouts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Workouts</a>
    <a href="#library" data-v="library"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Library</a>
    <a href="#progress" data-v="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
  </div>
</nav>

<div class="tpill" id="tpill" hidden><b id="tpillTxt">0:00</b><button type="button" data-act="tstop">Stop</button></div>
<div class="sheet-back" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="session" id="session" hidden role="dialog" aria-modal="true" aria-label="Guided session"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
